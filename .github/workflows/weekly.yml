name: weekly-researcher-discovery

on:
  schedule:
    # Mondays 13:00 UTC = 9am ET (EDT). During EST (winter) it fires at 8am ET.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      max_depth:
        description: "BFS depth (0=seeds only, 1=one hop; 2 needs batch works-fetching first)"
        default: "1"
        required: false
      slack_channel:
        description: "Slack channel to post to (empty = skip)"
        default: "hiring"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline (wide pool)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL || 'scraper@fleet.ai' }}
        run: |
          python expand.py \
            --seeds seeds_fleet.yaml \
            --config config_fleet.yaml \
            --max-depth "${{ github.event.inputs.max_depth || '1' }}" \
            --output-dir data/expand_output \
            --slack-channel "${{ github.event.inputs.slack_channel || 'hiring' }}"

      - name: Web-verify shortlist (top 40 per position)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python verify_shortlist.py --top 40

      - name: Upload wide-pool xlsx
        uses: actions/upload-artifact@v4
        with:
          name: researchers-${{ github.run_id }}
          path: data/expand_output/researchers.xlsx
          retention-days: 90

      - name: Upload shortlist xlsx
        uses: actions/upload-artifact@v4
        with:
          name: shortlist-${{ github.run_id }}
          path: |
            data/expand_output/shortlist.xlsx
            data/expand_output/shortlist_*.csv
          retention-days: 90

      - name: Post shortlist to Slack
        if: ${{ (github.event.inputs.slack_channel || 'hiring') != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sys
          from slack_post import upload_file
          channel = "${{ github.event.inputs.slack_channel || 'hiring' }}"
          token = os.environ["SLACK_BOT_TOKEN"]
          result = upload_file("data/expand_output/shortlist.xlsx", channel, token,
                               initial_comment=":dart: Weekly verified shortlist — top 40 per position, web-checked employers + personal emails")
          if not result:
              # Fail LOUDLY: a green delivery step that delivered nothing is
              # how a missing post goes unnoticed for weeks. Most common
              # cause: the bot is not a member of the (private) channel —
              # fix with /invite @claude2 in #hiring.
              print(f"::error::Slack upload to #{channel} failed — is @claude2 invited to the channel?")
              sys.exit(1)
          EOF

      - name: Commit updated caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expand_cache.json data/enrich_cache.json data/enrich_cache_by_id.json \
                  data/email_cache.json data/institution_domains.json data/verify_cache.json \
                  data/llm_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No cache changes to commit."
          else
            git commit -m "chore(weekly): refresh caches from $(date -u +%Y-%m-%d) run"
            git push
          fi
